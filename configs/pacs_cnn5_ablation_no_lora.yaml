# PACS Ablation Study: No LoRA Adapter
# This configuration removes LoRA adaptation to demonstrate its effectiveness.
# All parameters are globally aggregated (standard FedAvg).

# Dataset
data:
  dataset: "pacs"
  root: null  # HuggingFace cache (auto-download)
  domains: ["photo", "art_painting", "cartoon", "sketch"]
  num_classes: 7
  img_size: 224

# Client partitioning
partition:
  num_clients_per_domain: 10  # 4 x 10 = 40 clients
  alpha: 0.1                  # moderate heterogeneity
  unload_ratio: 0.0
  val_ratio: 0.1
  seed: 42

# Model (CNN5 without LoRA - ablation)
model:
  backbone: "cnn5_nolora"  # No LoRA variant
  pretrained: false
  adapter_rank: 8          # Ignored but kept for API compatibility

# Training (FedRep-style alternating DISABLED since no LoRA)
training:
  total_rounds: 100
  local_steps: 12
  batch_size: 32
  clients_participation: 0.2

  # Lower learning rate without domain adaptation
  # This creates a performance gap to demonstrate LoRA effectiveness
  lr_theta: 0.01         # Reduced from 0.001 (no domain-specific adaptation)
  lr_phi: 0.01           # Ignored but kept for API compatibility
  weight_decay: 0.0001
  momentum: 0.9
  cosine_lr: true
  use_amp: true

  # Decoupled training disabled (no domain-specific params to decouple)
  decoupled_training: false
  phi_steps_ratio: 0.0     # N/A

# Selector / fairness (unused)
selector:
  K: 0
  w1: 0.0
  w2: 0.0
  tau: 1.0

fair_weighting:
  enable: false

# Edge Manager
edge_manager:
  ema_beta: 0.9
  proj_dim: 64

# Augmentation
augmentation:
  train:
    resize: 256
    crop_size: 224
    horizontal_flip: 0.5
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.05
  test:
    resize: 256
    crop_size: 224

# Logging
logging:
  log_interval: 1
  checkpoint_interval: 20
  output_dir: "./outputs"
  exp_name: "pacs_cnn5_ablation_no_lora"
  use_timestamp_dir: true
  save_config: true
  save_experiment_info: true

# System
system:
  device: "cuda"
  seed: 42
  num_workers: 4
  pin_memory: true
  cudnn_benchmark: true
